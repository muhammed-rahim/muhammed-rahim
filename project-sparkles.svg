<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Magical project sparkles</title>
  <desc id="desc">Colorful glowing sparkles for a magical project card.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00f5ff" />
      <stop offset="0.5" stop-color="#c084fc" />
      <stop offset="1" stop-color="#ffd166" />
    </linearGradient>
    <filter id="spark" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <path d="M80 94 C230 25 350 125 500 70 S770 30 920 88" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.45" />
  <g fill="url(#glow)" filter="url(#spark)">
    <path d="M125 80 l6 18 18 6-18 6-6 18-6-18-18-6 18-6z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite" />
    </path>
    <path d="M335 50 l5 15 15 5-15 5-5 15-5-15-15-5 15-5z">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </path>
    <path d="M545 92 l7 20 20 7-20 7-7 20-7-20-20-7 20-7z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite" />
    </path>
    <path d="M760 48 l5 15 15 5-15 5-5 15-5-15-15-5 15-5z">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
    </path>
    <path d="M905 83 l6 18 18 6-18 6-6 18-6-18-18-6 18-6z">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.3s" repeatCount="indefinite" />
    </path>
  </g>
</svg>

