<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Colorful superhero full-stack mission</title>
  <desc id="desc">A generic superhero flies through a glowing tech sky with a shield, lightning, and colorful energy trails.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b2b" />
      <stop offset="0.45" stop-color="#26115f" />
      <stop offset="1" stop-color="#071f45" />
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#24d8ff" />
      <stop offset="0.45" stop-color="#f43f5e" />
      <stop offset="0.72" stop-color="#facc15" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#sky)" />
  <circle cx="160" cy="105" r="110" fill="#24d8ff" opacity="0.16" filter="url(#softGlow)" />
  <circle cx="1040" cy="235" r="135" fill="#f43f5e" opacity="0.15" filter="url(#softGlow)" />

  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="95" cy="52" r="3" /><circle cx="295" cy="82" r="2" /><circle cx="835" cy="58" r="3" />
    <circle cx="1088" cy="74" r="2" /><circle cx="1010" cy="148" r="3" />
  </g>

  <g fill="none" stroke="url(#energy)" stroke-linecap="round" filter="url(#glow)">
    <path d="M40 245 Q230 115 420 225" stroke-width="5" opacity="0.72" />
    <path d="M770 220 Q980 105 1160 235" stroke-width="5" opacity="0.72" />
    <path d="M90 270 Q260 180 405 250" stroke-width="2" opacity="0.55" />
  </g>

  <g transform="translate(0 0)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="-220 18; 40 -10; 300 15; 560 -8; 820 12; 1120 -6" dur="10s" repeatCount="indefinite" />
    <circle cx="250" cy="135" r="18" fill="#ffd7b5" />
    <path d="M232 128 Q250 96 268 128" fill="#101827" stroke="#60a5fa" stroke-width="4" />
    <path d="M225 157 Q250 140 276 157 L299 218 Q250 242 202 218Z" fill="#dc2626" stroke="#fca5a5" stroke-width="4" />
    <path d="M224 164 L184 196" stroke="#ffd7b5" stroke-width="9" stroke-linecap="round" />
    <path d="M274 164 L320 135" stroke="#ffd7b5" stroke-width="9" stroke-linecap="round" />
    <path d="M320 135 L352 105" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
    <path d="M352 105 l22 -20 M352 105 l27 4 M352 105 l6 25" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M224 218 L203 254 M273 218 L296 254" stroke="#111827" stroke-width="10" stroke-linecap="round" />
    <circle cx="250" cy="180" r="15" fill="#67e8f9" stroke="#e0f2fe" stroke-width="3">
      <animate attributeName="r" values="12;17;12" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(720 92)" filter="url(#glow)">
    <circle cx="78" cy="78" r="62" fill="#2563eb" stroke="#facc15" stroke-width="8" />
    <circle cx="78" cy="78" r="39" fill="#dc2626" stroke="#f8fafc" stroke-width="7" />
    <circle cx="78" cy="78" r="16" fill="#facc15" />
    <animateTransform attributeName="transform" type="rotate" values="0 78 78; 360 78 78" dur="8s" repeatCount="indefinite" />
  </g>

  <g stroke="#fef08a" stroke-width="5" stroke-linejoin="round" filter="url(#glow)">
    <path d="M610 54 L575 128 H608 L586 204 L665 110 H628 L650 54Z" fill="#facc15">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.05s" repeatCount="indefinite" />
    </path>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="292" fill="#f8fafc" font-size="23" font-weight="700" letter-spacing="7">HERO TECH INITIATIVE</text>
    <text x="600" y="326" fill="#67e8f9" font-size="15" letter-spacing="4">ASSEMBLE • BUILD • DEBUG • DEPLOY</text>
  </g>
</svg>

