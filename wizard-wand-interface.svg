<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Professional wizard wand spell animation</title>
  <desc id="desc">A sleek wand sweeps through a dark magical interface while a luminous spell trail and runes move across the scene.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07051B"/>
      <stop offset="0.5" stop-color="#171043"/>
      <stop offset="1" stop-color="#061F38"/>
    </linearGradient>
    <linearGradient id="spell" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="0.75" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#sky)"/>
  <circle cx="600" cy="150" r="90" fill="#7C3AED" opacity="0.12" filter="url(#soft)"/>

  <g fill="#FFFFFF" filter="url(#glow)">
    <circle cx="86" cy="84" r="1.5"/><circle cx="198" cy="244" r="1"/><circle cx="318" cy="66" r="1.4"/>
    <circle cx="470" cy="244" r="1.2"/><circle cx="785" cy="76" r="1.5"/><circle cx="972" cy="235" r="1.1"/>
    <circle cx="1094" cy="88" r="1.6"/><circle cx="1144" cy="166" r="1"/>
  </g>

  <g fill="none" stroke="url(#spell)" stroke-linecap="round" filter="url(#glow)">
    <path d="M30 230 C220 70 360 255 540 140 S850 40 1170 210" stroke-width="3" stroke-dasharray="2 16" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M40 250 C220 95 360 260 540 155 S860 55 1160 220" stroke-width="1" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="-230 30; 50 -12; 320 18; 590 -10; 860 12; 1160 -8" dur="11s" repeatCount="indefinite"/>
    <path d="M155 180 L345 106" stroke="#8B5A2B" stroke-width="12" stroke-linecap="round"/>
    <path d="M155 180 L345 106" stroke="#EAB676" stroke-width="3" stroke-linecap="round"/>
    <path d="M145 184 L165 176" stroke="#C08457" stroke-width="17" stroke-linecap="round"/>
    <circle cx="349" cy="104" r="7" fill="#FEF3C7"/>
    <path d="M350 104 C390 74 420 88 448 60" fill="none" stroke="url(#spell)" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M448 60 l18 -20 M448 60 l25 5 M448 60 l9 23" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(600 148)" filter="url(#glow)">
    <circle r="54" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="2 9">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="37" fill="#090B26" stroke="url(#spell)" stroke-width="3"/>
    <path d="M0 -22 L8 -7 L23 -7 L11 3 L15 19 L0 10 L-15 19 L-11 3 L-23 -7 L-8 -7Z" fill="#FDE68A">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#E9D5FF" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="52" fill="#94A3B8" font-size="14" letter-spacing="6">WIZARDING DEVELOPER ARCHIVE</text>
    <text x="600" y="274" fill="#F8FAFC" font-size="23" font-weight="700" letter-spacing="6">WIZARDING FULL-STACK QUEST</text>
    <text x="600" y="300" fill="#67E8F9" font-size="13" letter-spacing="4">CAST • CREATE • DEBUG • DEPLOY</text>
  </g>
</svg>

