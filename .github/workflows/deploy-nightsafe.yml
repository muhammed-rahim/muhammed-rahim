name: Deploy NightSafe
on:
  push:
    branches: [nightsafe-real]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate runtime config
        run: |
          cat > nightsafe/config.js <<'EOF'
          window.NIGHTSAFE_CONFIG = {
            supabaseUrl: "${{ secrets.SUPABASE_URL }}",
            supabaseAnonKey: "${{ secrets.SUPABASE_ANON_KEY }}"
          };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nightsafe
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4