<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Colorful wizard coding quest</title>
  <desc id="desc">A glowing generic wizard flies across a magical sky while casting colorful lightning and light spells.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08051d" />
      <stop offset="0.45" stop-color="#241052" />
      <stop offset="1" stop-color="#063b5b" />
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" />
      <stop offset="0.33" stop-color="#8b5cf6" />
      <stop offset="0.66" stop-color="#ff3cac" />
      <stop offset="1" stop-color="#ffd166" />
    </linearGradient>
    <filter id="light" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="wideLight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#sky)" />
  <ellipse cx="600" cy="325" rx="470" ry="45" fill="#00f5ff" opacity="0.13" filter="url(#wideLight)" />
  <path d="M0 286 Q220 236 420 286 T800 286 T1200 270 V360 H0Z" fill="#050816" opacity="0.72" />

  <g fill="#ffffff" filter="url(#light)">
    <circle cx="110" cy="72" r="3" /><circle cx="190" cy="180" r="2" /><circle cx="330" cy="58" r="3" />
    <circle cx="860" cy="68" r="3" /><circle cx="1030" cy="124" r="2" /><circle cx="1110" cy="55" r="3" />
  </g>

  <g fill="none" stroke="url(#rainbow)" stroke-width="4" stroke-linecap="round" filter="url(#light)">
    <path d="M100 245 Q280 120 455 220" opacity="0.65" />
    <path d="M745 215 Q920 115 1100 235" opacity="0.65" />
  </g>

  <g fill="#ffd166" stroke="#fff4bd" stroke-width="2" filter="url(#light)">
    <path d="M250 214 l13 24 25 5-19 18 4 26-23-12-24 12 5-26-19-18 25-5z">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.7s" repeatCount="indefinite" />
    </path>
    <path d="M930 190 l10 19 21 4-16 15 3 21-18-10-19 10 4-21-16-15 21-4z">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite" />
    </path>
  </g>

  <g transform="translate(0 0)" filter="url(#light)">
    <animateTransform attributeName="transform" type="translate" values="-100 12; 80 -12; 260 12; 440 -8; 620 10; 800 -8; 980 10; 1200 -4" dur="11s" repeatCount="indefinite" />
    <path d="M168 170 Q238 164 310 187" fill="none" stroke="#d49a45" stroke-width="8" stroke-linecap="round" />
    <path d="M168 170 Q230 176 310 187" fill="none" stroke="#ffe08a" stroke-width="2" />
    <circle cx="220" cy="126" r="16" fill="#ffd7b5" />
    <path d="M204 116 L220 78 L242 116 Q224 108 204 116Z" fill="#5b21b6" stroke="#c084fc" stroke-width="3" />
    <path d="M204 145 Q220 136 237 145 L258 190 Q222 207 188 190Z" fill="#7c3aed" stroke="#c4b5fd" stroke-width="3" />
    <path d="M205 151 L176 174" stroke="#ffd7b5" stroke-width="7" stroke-linecap="round" />
    <path d="M236 151 L271 123" stroke="#ffd7b5" stroke-width="7" stroke-linecap="round" />
    <path d="M271 123 L302 99" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" />
    <path d="M302 99 l18 -21 M302 99 l25 2 M302 99 l8 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" repeatCount="indefinite" />
    </path>
    <path d="M204 191 L186 222 M238 191 L254 222" stroke="#19133d" stroke-width="8" stroke-linecap="round" />
  </g>

  <g stroke="#ffffff" stroke-width="5" stroke-linejoin="round" filter="url(#light)">
    <path d="M640 72 L604 142 H638 L614 216 L696 126 H657 L680 72Z" fill="#facc15">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite" />
    </path>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="292" fill="#e0e7ff" font-size="18" letter-spacing="5">WIZARDING FULL-STACK QUEST</text>
    <text x="600" y="325" fill="#67e8f9" font-size="14" letter-spacing="3">CAST • CREATE • DEBUG • REPEAT</text>
  </g>
</svg>

